services:
  db:
    image: postgres:16-alpine
    container_name: agent_harness_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_harness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_harness"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_harness_app
    restart: unless-stopped
    environment:
      APP_NAME: "AI Agent Harness"
      APP_ENV: production
      DEBUG: "false"
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agent_harness
      TRUST_THRESHOLD: 3
      MOCK_LLM_ENABLED: "true"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4.1-mini
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    driver: local
